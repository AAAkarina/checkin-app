<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台 - 今夜晚安否？</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#111;color:#ddd;font-family:system-ui,sans-serif;padding:24px;max-width:600px;margin:0 auto}
h2{color:#fff;text-align:center;margin-bottom:24px}
.stat{background:#1a1a1a;border-radius:16px;padding:20px 24px;text-align:center;margin-bottom:20px}
.num{display:block;font-size:44px;color:#667eea;font-weight:700}
.label{font-size:14px;color:#888}
h3{color:#fff;margin:24px 0 12px}
table{width:100%;border-collapse:collapse;margin-bottom:20px;background:#1a1a1a;border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;font-size:14px}
th{color:#888;border-bottom:1px solid #222}
.badge{background:#667eea;color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:600}
.badge2{background:#e74c3c;color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:600}
.link{text-align:center;margin-top:24px;font-size:12px;color:#666}
.refresh{background:none;border:1px solid #444;color:#888;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12px;margin-bottom:20px}
</style>
</head>
<body>
<div id="main">
<h2>🌙 今夜晚安否？</h2>
<div class="stat"><span class="num" id="total">-</span><span class="label">总打卡人次</span></div>
<div class="stat"><span class="num" id="today">-</span><span class="label">今日打卡</span></div>
<div id="todayDetail"></div>
<div id="absent"></div>
<div id="allStats"></div>
<div id="recent"></div>
<button class="refresh" onclick="load()">🔄 刷新</button>
<p class="link" id="linkArea"></p>
</div>
<script>
function getToken(){const h=location.hash.slice(1);const m=h.match(/token=([^&]+)/);return m?m[1]:sessionStorage.getItem('ght')||''}
function setToken(t){sessionStorage.setItem('ght',t)};(function(){const t=getToken();if(t)setToken(t)})()

const API='https://api.github.com/repos/AAAkarina/checkin-app/contents/data.json?ref=gh-pages';

async function load(){
const TOKEN=getToken();if(!TOKEN){alert('Token未找到');return}
const H={Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github+json'};
try{
const r=await fetch(API,{headers:H});const d=await r.json();
const data=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/[^A-Za-z0-9+/=]/g,'')))));show(data);
document.getElementById('linkArea').innerHTML='打卡链接：<code>'+location.origin+location.pathname.replace('admin.html','')+'#token='+getToken()+'</code>'
}catch(e){alert('加载失败: '+e.message)}
}

function show(data){
const records=data.records||[];const roster=data.roster||[];const today=new Date().toISOString().slice(0,10);

// 总数
document.getElementById('total').textContent=records.length;

// 今日统计
const todayRecords=records.filter(r=>r.date===today);
document.getElementById('today').textContent=todayRecords.length;

// 今日详情（谁打了）
if(todayRecords.length){
let h='<h3>✅ 今日已打卡</h3><table><tr><th>昵称</th><th>时间</th></tr>';
todayRecords.forEach(r=>{h+='<tr><td><span class="badge">'+escapeHtml(r.nickname||'?')+'</span></td><td>'+(r.time||'').slice(11,19)+'</td></tr>'});
h+='</table>';document.getElementById('todayDetail').innerHTML=h
}else{document.getElementById('todayDetail').innerHTML='<p style="color:#888;margin-bottom:20px">今日暂无打卡</p>'}

// 缺席
const todayNicknames=todayRecords.map(r=>r.nickname);
const absent=roster.filter(n=>!todayNicknames.includes(n));
if(absent.length){
let h='<h3>❌ 今日尚未打卡</h3><p>';
absent.forEach(n=>{h+='<span class="badge2">'+escapeHtml(n)+'</span> '});
h+='</p>';document.getElementById('absent').innerHTML=h
}else if(roster.length){document.getElementById('absent').innerHTML='<p style="color:#2ecc71;margin-bottom:20px">🎉 全员已打卡！</p>'}

// 全量统计
const perPerson={};records.forEach(r=>{const n=r.nickname||'?';perPerson[n]=(perPerson[n]||0)+1});
let h='<h3>📊 全员统计</h3><table><tr><th>昵称</th><th>总打卡次数</th><th>最近一次</th></tr>';
Object.entries(perPerson).sort((a,b)=>b[1]-a[1]).forEach(([n,c])=>{const last=records.filter(r=>r.nickname===n).pop();h+='<tr><td>'+escapeHtml(n)+'</td><td>'+c+'</td><td>'+(last?last.time.slice(0,16):'-')+'</td></tr>'});
h+='</table>';document.getElementById('allStats').innerHTML=h;

// 最近记录
const recent=records.slice(-20).reverse();
h='<h3>📋 最近记录</h3><table><tr><th>昵称</th><th>时间</th></tr>';
recent.forEach(r=>{h+='<tr><td>'+escapeHtml(r.nickname||'?')+'</td><td>'+((r.time||'').slice(0,19))+'</td></tr>'});
h+='</table>';document.getElementById('recent').innerHTML=h
}

function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
load();
</script>
</body>
</html>
